<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS spriye</title>
    <link rel="stylesheet" href="sprite.css" />
  </head>
  <style>
    body {
      font-family: sans-serif;
      color: #555;
      margin: 0;
      line-height: 1.5;
    }
    a,
    a:visited {
      color: #e74c3c;
      text-decoration: none;
    }
    a:hover {
      box-shadow: 0 1px;
    }
    header {
      background: #f1f1f1;
    }
    p {
      margin: 1em 0;
    }
    h1 {
      font-size: 1.5em;
      font-weight: normal;
      margin: 1em 0 0.75em;
      color: #999;
      box-shadow: 0 1px #ddd, 0 2px #fff, 0 3px #ddd;
    }
    .mhl {
      margin-left: 1.5em;
      margin-right: 1.5em;
    }
    .cell {
      float: left;
      margin-right: 1.5em;
      margin-bottom: 0.25em;
      width: 17em;
      overflow: hidden;
    }
    .cell span {
      margin-right: 0.25em;
    }
    .clearfix:before,
    .clearfix:after {
      content: " ";
      display: table;
    }
    .clearfix:after {
      clear: both;
    }
    .fs1 {
      font-size: 32px;
    }
  </style>
  <body>
    <header class="clearfix">
        <p>css sprite - generated by <a href="https://icomoon.io/app">IcoMoon</a></p> </header>
        <div class="clearfix mh1">
           
            <div class="cell fs1"> <span></span></div>
        </div>
  </body>
</html>
